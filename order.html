<title>Purrfect Hokkaido</title>

<script>
// Moved 5 Nov 2026 (build_forwarders.py): same page at the new address, same ?query and #hash.
(function () {
  var to = "https://purrfectdigital.online/clients/purrfect-hokkaido/menu/order.html", h = location.hash, carry = '';
  try {
    if (!localStorage.getItem('ph-moved')) {       // once per phone: bring its saved data along
      var ls = {}, n = 0;
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (/^(ph|pos)-/.test(k) && k !== 'ph-moved' && k !== 'pos-session') { ls[k] = localStorage.getItem(k); n++; }
      }
      if (n) {
        var s = btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, h: h, ls: ls }))))
          .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        if (s.length < 1500000) carry = '#ph-carry=' + s;
      }
      localStorage.setItem('ph-moved', new Date().toISOString());
    }
  } catch (e) {}
  location.replace(to + location.search + (carry || h));
})();
</script>
