<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order for Pickup · Purrfect Hokkaido</title>
<meta name="description" content="Order Purrfect Hokkaido for pickup and pay at the counter.">
<meta name="theme-color" content="#122565">
<meta name="robots" content="noindex">
<link rel="icon" href="img/cat-mark.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,400..700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAEAEA;--card:#fff;--navy:#122565;--teal:#108092;--green:#448F18;--orange:#EA6010;--price:#EB4E06;--ink:#1A2A44;--indigo:#1A2C88;--line:#d9d9d9;--muted:#5b6475;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
header.brand{display:flex;flex-direction:column;align-items:center;padding:18px 16px 4px}
.lockup{display:flex;align-items:center;gap:9px;text-decoration:none}
.lockup img{height:52px;width:auto}
.w1{font-weight:700;font-size:28px;line-height:.9;color:var(--navy)}
.w2{font-weight:700;font-size:19.5px;line-height:1;color:var(--teal);letter-spacing:.2em}
.w2 span{color:var(--green)}
h1{margin-top:16px;text-align:center;font-weight:700;font-size:26px;color:var(--navy)}
.lead{margin-top:4px;text-align:center;font-size:15px;color:var(--muted)}
.back{display:block;margin-top:8px;text-align:center;font-size:14.5px;color:var(--navy);font-weight:600}
.banner{margin-top:16px;padding:12px 14px;border-radius:12px;font-weight:600;font-size:15px;line-height:1.35}
.banner.info{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.banner.warn{background:#fde7d9;color:#7a2d00}
.banner[hidden]{display:none}
section{margin-top:24px}
h2{font-weight:700;font-stretch:85%;font-size:21px;line-height:1.1;color:var(--navy);text-transform:uppercase;padding-bottom:7px;border-bottom:3px solid var(--orange)}
.item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.pic{width:64px;height:64px;object-fit:contain;flex:none;background:var(--card);border-radius:12px;padding:4px}
.body{flex:1;min-width:0}
.nm{font-weight:600;font-size:17.5px;line-height:1.2;color:var(--indigo);display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.star{width:18px;height:18px;flex:none}
.tag{font:700 10.5px/1 Montserrat,sans-serif;color:#fff;background:var(--navy);border-radius:99px;padding:4px 7px;letter-spacing:.05em;text-transform:uppercase}
.tag.new{background:var(--green)}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:2px}
.opt .ol{flex:1;font-size:15px;color:var(--muted)}
.opt .pr{font-weight:700;font-size:18px;color:var(--price);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.add{font:inherit;font-weight:700;font-size:15px;color:#fff;background:var(--navy);border:0;border-radius:99px;min-width:76px;height:38px;padding:0 16px;cursor:pointer}
.add:disabled{background:#c9cdd6;cursor:not-allowed}
.sub{margin-top:6px;font-size:14px;color:var(--muted)}
.adds{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 8px}
.adds .al{font-size:13.5px;color:var(--muted)}
.chip{font:inherit;font-weight:600;font-size:14px;color:var(--navy);background:#fff;border:1.5px solid #b9bfcc;border-radius:99px;min-height:34px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{color:#fff;background:var(--navy);border-color:var(--navy)}
.chip:disabled{color:#9aa0ab;border-color:#d9d9d9;cursor:not-allowed}
.step{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1.5px solid var(--navy);border-radius:99px;height:38px}
.step button{font:inherit;font-weight:700;font-size:20px;line-height:1;color:var(--navy);background:none;border:0;width:38px;height:36px;cursor:pointer}
.step b{min-width:22px;text-align:center;font-size:16px;color:var(--navy)}
.soldout{font-weight:700;font-size:13px;color:#9a3b00;background:#fde7d9;border-radius:99px;padding:6px 12px}
#checkout{margin-top:30px;background:#fff;border-radius:18px;padding:18px 16px 20px;box-shadow:0 2px 10px rgba(18,37,101,.08)}
#checkout h2{border-bottom-width:3px}
.cohead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--orange);padding-bottom:7px}
.cohead h2{border:0;padding:0}
.clear{font:inherit;font-weight:600;font-size:14.5px;color:#b00020;background:#fff;border:1.5px solid #e2b4bb;border-radius:99px;min-height:34px;padding:4px 14px;cursor:pointer}
.clear[hidden]{display:none}
.empty{margin-top:12px;color:var(--muted)}
.li{border-bottom:1px solid var(--line)}
.li.on{background:#eef1f8;margin:0 -16px;padding:0 16px 14px}
.line{display:flex;align-items:center;gap:10px;padding:10px 0}
.line .ln{flex:1;font-size:16px;color:var(--indigo);font-weight:600;line-height:1.2}
.line .ln small{display:block;font-weight:500;font-size:13.5px;color:var(--muted)}
.line .lp{font-weight:700;color:var(--price);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.edit{display:block;font:inherit;font-weight:600;font-size:14.5px;color:var(--navy);background:none;border:0;padding:6px 0 0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.editor .adds{margin:2px 0 10px}
.enote{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.eb{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-weight:700;font-size:20px;color:var(--navy)}
.total b{color:var(--price);font-size:24px}
label{display:block;margin-top:14px;font-weight:600;font-size:15px;color:var(--navy)}
label small{font-weight:500;color:var(--muted)}
input,select,textarea{display:block;width:100%;margin-top:6px;font:inherit;font-size:17px;color:var(--ink);background:#fff;border:1.5px solid #b9bfcc;border-radius:12px;padding:11px 12px}
textarea{min-height:68px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(18,37,101,.25);border-color:var(--navy)}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.pay{margin-top:14px;padding:11px 12px;border-radius:12px;background:#eef1f8;color:var(--navy);font-size:15px;line-height:1.35}
.err{margin-top:12px;color:#b00020;font-weight:600;font-size:15px}
.place{display:block;width:100%;margin-top:16px;font:inherit;font-weight:700;font-size:19px;color:#fff;background:var(--price);border:0;border-radius:14px;height:54px;cursor:pointer}
.place:disabled{background:#c9cdd6;cursor:not-allowed}
.cartbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(234,234,234,.96);border-top:1px solid #cfd3db}
.cartbar a{display:flex;justify-content:space-between;align-items:center;max-width:688px;margin:0 auto;text-decoration:none;color:#fff;background:var(--navy);border-radius:14px;height:52px;padding:0 18px;font-weight:700;font-size:17px}
.cartbar[hidden]{display:none}
.done{margin-top:22px;background:#fff;border-radius:18px;padding:24px 18px;text-align:center;box-shadow:0 2px 10px rgba(18,37,101,.08)}
.done .k{font-size:15px;color:var(--muted)}
.done .num{margin-top:4px;font-weight:700;font-size:54px;line-height:1;color:var(--navy);letter-spacing:.02em}
.st{display:inline-block;margin-top:16px;padding:8px 16px;border-radius:99px;font-weight:700;font-size:17px}
.st.New{background:#fde7d9;color:#7a2d00} .st.Preparing{background:#fff2cc;color:#6b4e00}
.st.Ready{background:#d9ead3;color:#1d5a0c} .st.Picked{background:#eee;color:#444} .st.Cancelled{background:#f4cccc;color:#7a0000}
.done p{margin-top:12px;font-size:16px;line-height:1.4}
.done .sum{margin-top:16px;text-align:left;border-top:1px solid var(--line);padding-top:12px;font-size:15px;white-space:pre-line;color:var(--indigo)}
.again{margin-top:18px;font:inherit;font-weight:700;font-size:16px;color:var(--navy);background:#fff;border:1.5px solid var(--navy);border-radius:99px;height:44px;padding:0 20px;cursor:pointer}
</style>
</head>
<body>
<header class="brand">
  <a class="lockup" href="./"><img src="img/cat-mark.webp" alt="" width="52" height="52"><div><div class="w1">PURRFECT</div><div class="w2">HOKKAID<span>O</span></div></div></a>
</header>
<main class="wrap" id="app">
  <h1>Order for pickup</h1>
  <p class="lead">Choose your items and place your order, then pay at the counter. We start making it once it’s paid.</p>
  <a class="back" href="./">← Back to the menu</a>
  <div class="banner info" id="banner" hidden></div>
  <div id="menu"></div>
  <section id="checkout">
    <div class="cohead"><h2>Your order</h2><button type="button" class="clear" id="clear" hidden>Clear all</button></div>
    <div id="lines"></div>
    <form id="form" novalidate>
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="given-name" maxlength="40" required>
      <label for="phone">Mobile number <small>(we only use it for this order)</small></label>
      <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0917 123 4567" maxlength="16" required>
      <label for="pickup">Pickup time</label>
      <select id="pickup" name="pickup">
        <option value="asap">As soon as possible</option><option value="15">In 15 minutes</option>
        <option value="30">In 30 minutes</option><option value="45">In 45 minutes</option><option value="60">In 1 hour</option>
      </select>
      <label for="notes">Notes <small>(optional, e.g. less ice)</small></label>
      <textarea id="notes" name="notes" maxlength="200"></textarea>
      <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
      <p class="pay">💵 Pay at the counter (cash or GCash) and tell the staff your order number. <b>Orders are prepared only after payment.</b></p>
      <p class="err" id="err" role="alert"></p>
      <button class="place" id="place" type="submit" disabled>Place order</button>
    </form>
  </section>
</main>
<div class="cartbar" id="cartbar" hidden><a href="#checkout"><span id="cartcount"></span><span id="carttotal"></span></a></div>

-oat-milk"]}, {"id": "psp-white-mocha-latte", "name": "White Mocha Latte", "full": "White Mocha Latte", "img": null, "best": false, "note": "", "options": [{"label": "Hot · Mediano", "price": 100}, {"label": "Iced · Mediano", "price": 100}, {"label": "Iced · Grande", "price": 120}], "addons": ["cad-espresso-shot", "cad-oat-milk"]}, {"id": "psp-irish-cream-latte", "name": "Irish Cream Latte", "full": "Irish Cream Latte", "img": null, "best": false, "note": "", "options": [{"label": "Hot · Mediano", "price": 100}, {"label": "Iced · Mediano", "price": 100}, {"label": "Iced · Grande", "price": 120}], "addons": ["cad-espresso-shot", "cad-oat-milk"]}, {"id": "psp-ube-espresso", "name": "Ube Espresso", "full": "Ube Espresso", "img": null, "best": false, "note": "", "options": [{"label": "Hot · Mediano", "price": 100}, {"label": "Iced · Mediano", "price": 100}, {"label": "Iced · Grande", "price": 120}], "addons": ["cad-espresso-shot", "cad-oat-milk"]}, {"id": "psp-affogato", "name": "Affogato", "full": "Affogato", "img": null, "best": false, "note": "", "options": [{"label": "", "price": 100}]}], "sub": "Want an extra espresso shot (+₱30) or oat milk (+₱40)? Tap Add, then pick it under the drink."}, {"title": "Iced Drinks", "items": [{"id": "ice-gourmet-chocolate", "name": "Gourmet Chocolate", "full": "Gourmet Chocolate", "img": null, "best": false, "note": "Mediano", "options": [{"label": "", "price": 110}], "addons": ["cad-espresso-shot", "cad-oat-milk"]}, {"id": "ice-iced-strawberry-milk", "name": "Iced Strawberry Milk", "full": "Iced Strawberry Milk", "img": null, "best": false, "note": "Mediano", "options": [{"label": "", "price": 110}], "addons": ["cad-espresso-shot", "cad-oat-milk"]}, {"id": "ice-matcha-latte", "name": "Matcha Latte", "full": "Matcha Latte", "img": null, "best": false, "note": "Mediano", "options": [{"label": "", "price": 110}], "addons": ["cad-espresso-shot", "cad-oat-milk"]}, {"id": "ice-ube-latte", "name": "Ube Latte", "full": "Ube Latte", "img": null, "best": false, "note": "Mediano", "options": [{"label": "", "price": 110}], "addons": ["cad-espresso-shot", "cad-oat-milk"]}], "sub": "Want an extra espresso shot (+₱30) or oat milk (+₱40)? Tap Add, then pick it under the drink."}, {"title": "Snacks", "items": [{"id": "snk-chicken-poppers", "name": "Chicken Poppers", "full": "Chicken Poppers", "img": null, "best": false, "note": "", "options": [{"label": "", "price": 120}]}, {"id": "snk-fries", "name": "Fries", "full": "Fries", "img": null, "best": false, "note": "", "options": [{"label": "", "price": 120}]}, {"id": "snk-chicken-poppers-fries", "name": "Chicken Poppers + Fries", "full": "Combo: Chicken Poppers + Fries", "img": null, "best": false, "note": "Combo", "options": [{"label": "", "price": 220}]}, {"id": "snk-nachos", "name": "Nachos", "full": "Nachos", "img": null, "best": false, "note": "", "options": [{"label": "", "price": 240}]}]}, {"title": "Coffee add-ons", "items": [{"id": "cad-espresso-shot", "name": "Espresso Shot", "full": "Coffee add-on: Espresso Shot", "img": null, "best": false, "note": "", "options": [{"label": "", "price": 30}]}, {"id": "cad-oat-milk", "name": "Oat Milk", "full": "Coffee add-on: Oat Milk", "img": null, "best": false, "note": "", "options": [{"label": "", "price": 40}]}], "hidden": true}]};
const STAR = "<svg class=\"star\" viewBox=\"0 0 100 100\" role=\"img\" aria-label=\"Best seller\"><path d=\"M50 6 L62 36 L94 38 L69 58 L77 90 L50 72 L23 90 L31 58 L6 38 L38 36 Z\" fill=\"#FCF41C\" stroke=\"#141414\" stroke-width=\"7\" stroke-linejoin=\"round\"/></svg>";
const $ = s => document.querySelector(s);
const peso = n => '₱' + n.toLocaleString('en-PH');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const items = {}, ADDONS = {};
DATA.sections.forEach(s => s.items.forEach(it => { items[it.id] = it; if (s.hidden) ADDONS[it.id] = it; }));
const addonPrice = a => ADDONS[a].options[0].price;
const key = (id, opt) => id + '|' + opt;
let cart = store.get('ph-cart') || {};          // "id|option" -> qty
let soldOut = new Set(), open = !!DATA.url, sending = false;
let editing = null, merged = null;               // cart key open in the order-box editor; key a change was folded into
Object.keys(cart).forEach(k => { const [id, opt] = k.split('|'); if (!items[id] || !items[id].options.some(o => o.label === opt)) delete cart[k]; });
let extras = store.get('ph-extras') || {};      // "id|option" -> add-on ids for that coffee line
Object.keys(extras).forEach(k => { const it = items[k.split('|')[0]]; if (!cart[k] || !it || !it.addons) delete extras[k]; else extras[k] = extras[k].filter(a => it.addons.includes(a) && ADDONS[a]); });

function control(id, opt) {
  const k = key(id, opt), q = cart[k] || 0;
  if (soldOut.has(k)) return '<span class="soldout">Sold out</span>';
  if (!q) return `<button class="add" data-k="${esc(k)}" data-d="1" ${open ? '' : 'disabled'}>Add</button>`;
  return `<span class="step"><button data-k="${esc(k)}" data-d="-1" aria-label="Remove one">−</button><b>${q}</b><button data-k="${esc(k)}" data-d="1" aria-label="Add one">+</button></span>`;
}

function addsRow(it, k) {
  if (!it.addons || !cart[k]) return '';
  return `<div class="adds"><span class="al">Add-ons:</span>${it.addons.filter(a => ADDONS[a]).map(a => {
    const on = (extras[k] || []).includes(a), gone = soldOut.has(a + '|');
    return `<button class="chip" data-x="${esc(k)}" data-a="${esc(a)}" aria-pressed="${on && !gone}" ${gone || !open ? 'disabled' : ''}>+ ${esc(ADDONS[a].name)} ${gone ? '· sold out' : peso(addonPrice(a))}</button>`;
  }).join('')}</div>`;
}

function optHtml(it, o) {
  const k = key(it.id, o.label);
  return `<div class="optw" id="w-${esc(k)}"><div class="opt"><span class="ol">${esc(o.label)}</span><span class="pr">${peso(o.price)}</span>${control(it.id, o.label)}</div>${addsRow(it, k)}</div>`;
}

function renderMenu() {
  $('#menu').innerHTML = DATA.sections.filter(s => !s.hidden).map(s => `<section><h2>${esc(s.title)}</h2>${s.sub ? `<p class="sub">${esc(s.sub)}</p>` : ''}${s.items.map(it => `
    <div class="item">${it.img ? `<img class="pic" src="${it.img}" alt="" loading="lazy" width="64" height="64">` : ''}
      <div class="body"><div class="nm">${it.note && it.note !== 'New' ? `<span class="tag">${esc(it.note)}</span>` : ''}${esc(it.name)}${it.best ? STAR : ''}${it.note === 'New' ? '<span class="tag new">New</span>' : ''}</div>
        ${it.options.map(o => optHtml(it, o)).join('')}
      </div></div>`).join('')}</section>`).join('');
}

function lines() {
  return Object.entries(cart).filter(([, q]) => q > 0).map(([k, q]) => {
    const [id, opt] = k.split('|'), it = items[id], o = it.options.find(x => x.label === opt);
    const adds = (extras[k] || []).filter(a => ADDONS[a] && !soldOut.has(a + '|'));
    return { k, id, option: opt, qty: q, name: it.full, adds, addNames: adds.map(a => ADDONS[a].name),
      price: o.price + adds.reduce((s, a) => s + addonPrice(a), 0) };
  });
}

function editor(l) {
  const it = items[l.id], k = l.k;
  const opts = it.options.length < 2 ? '' : `<div class="adds"><span class="al">Option:</span>${it.options.map(o => {
    const gone = soldOut.has(key(it.id, o.label));
    return `<button class="chip" data-e="${esc(k)}" data-o="${esc(o.label)}" aria-pressed="${o.label === l.option}" ${gone || !open ? 'disabled' : ''}>${esc(o.label)} ${gone ? '· sold out' : peso(o.price)}</button>`;
  }).join('')}</div>`;
  return `<div class="editor">${opts}${addsRow(it, k)}<div class="adds"><span class="al">Quantity:</span>${control(l.id, l.option)}</div>
    ${merged === k ? `<p class="enote">Combined with the ${esc(l.option)} already in your order.</p>` : ''}
    <div class="eb"><button type="button" class="clear" data-rm="${esc(k)}" ${open ? '' : 'disabled'}>Remove item</button><button type="button" class="add" data-ed="">Done</button></div></div>`;
}

function changeOption(k, opt) {
  const [id, cur] = k.split('|'), nk = key(id, opt), q = cart[k], had = !!cart[nk];
  if (opt === cur || !q || soldOut.has(nk)) return;
  // keep the line where it was; if that option is already in the order, fold the other line into this one
  cart = Object.fromEntries(Object.entries(cart).flatMap(([x, n]) =>
    x === k ? [[nk, had ? Math.min(20, cart[nk] + q) : q]] : x === nk ? [] : [[x, n]]));
  const adds = [...new Set([...(extras[nk] || []), ...(extras[k] || [])])];
  delete extras[k];
  if (adds.length) extras[nk] = adds; else delete extras[nk];
  editing = nk; merged = had ? nk : null;
  update(k); update(nk);
}

function renderCart() {
  if (editing && !cart[editing]) editing = null;
  const ls = lines(), n = ls.reduce((s, l) => s + l.qty, 0), total = ls.reduce((s, l) => s + l.qty * l.price, 0);
  $('#lines').innerHTML = ls.length ? ls.map(l => { const on = editing === l.k; return `<div class="li${on ? ' on' : ''}"><div class="line"><span class="ln">${l.qty}× ${esc(l.name)}${l.option || l.adds.length ? `<small>${esc([l.option, ...l.addNames.map(n => '+ ' + n)].filter(Boolean).join(' · '))}</small>` : ''}${on || sending ? '' : `<button type="button" class="edit" data-ed="${esc(l.k)}">Edit</button>`}</span>
      <span class="lp">${peso(l.qty * l.price)}</span>${on ? '' : control(l.id, l.option)}</div>${on ? editor(l) : ''}</div>`; }).join('') + `<div class="total"><span>Total</span><b>${peso(total)}</b></div>`
    : '<p class="empty">Nothing yet. Tap Add on any item above.</p>';
  $('#cartbar').hidden = !n;
  $('#clear').hidden = !n || sending;
  $('#cartcount').textContent = `View order · ${n} item${n === 1 ? '' : 's'}`;
  $('#carttotal').textContent = peso(total);
  $('#place').disabled = !n || !open || sending;
  store.set('ph-cart', cart);
  store.set('ph-extras', extras);
}

function update(k) {
  const [id, opt] = k.split('|'), it = items[id], w = document.getElementById('w-' + k);
  if (w) w.outerHTML = optHtml(it, it.options.find(o => o.label === opt));
  renderCart();
}

document.addEventListener('click', e => {
  if (sending) return;
  const ed = e.target.closest('button[data-ed]');
  if (ed) { editing = ed.dataset.ed || null; merged = null; return renderCart(); }
  const rm = e.target.closest('button[data-rm]');
  if (rm && open) { const k = rm.dataset.rm; delete cart[k]; delete extras[k]; return update(k); }
  const o = e.target.closest('button[data-e]');
  if (o && open) return changeOption(o.dataset.e, o.dataset.o);
  const c = e.target.closest('button[data-x]');
  if (c && open) {
    const k = c.dataset.x, a = c.dataset.a, cur = extras[k] || [];
    extras[k] = cur.includes(a) ? cur.filter(x => x !== a) : [...cur, a];
    return update(k);
  }
  const b = e.target.closest('button[data-k]');
  if (!b || !open) return;
  const k = b.dataset.k, q = Math.max(0, Math.min(20, (cart[k] || 0) + Number(b.dataset.d)));
  if (q) cart[k] = q; else { delete cart[k]; delete extras[k]; }
  update(k);
});

$('#clear').addEventListener('click', () => {
  if (!confirm('Remove everything from your order?')) return;
  cart = {}; extras = {}; editing = null;
  $('#err').textContent = '';
  renderMenu(); renderCart();
});

function banner(text, warn) { const el = $('#banner'); el.textContent = text; el.className = 'banner ' + (warn ? 'warn' : 'info'); el.hidden = !text; }

async function loadStatus() {
  if (!DATA.url) { open = false; banner('Online ordering is coming soon. Please order at the counter for now.', true); return; }
  try {
    const r = await (await fetch(DATA.url + '?status=1', { cache: 'no-store' })).json();
    open = !!r.open; soldOut = new Set(r.soldOut || []);
    banner(open ? '' : (r.message || 'Online ordering is paused right now.'), true);
    soldOut.forEach(k => delete cart[k]);
  } catch (e) {
    banner("We couldn't check if ordering is open. You can still try to place your order.", false);
  }
}

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('#err'); err.textContent = '';
  const ls = lines();
  const name = $('#name').value.trim(), phone = $('#phone').value.trim();
  if (!ls.length) return (err.textContent = 'Your order is empty.');
  if (!name) return (err.textContent = 'Please enter your name.'), $('#name').focus();
  const digits = phone.replace(/\D/g, '').replace(/^63/, '0').replace(/^9(\d{9})$/, '09$1');
  if (!/^09\d{9}$/.test(digits)) return (err.textContent = 'Please enter a valid mobile number, e.g. 0917 123 4567.'), $('#phone').focus();
  sending = true; renderCart(); $('#place').textContent = 'Sending…';
  try {
    const res = await fetch(DATA.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ name, phone: digits, pickup: $('#pickup').value, notes: $('#notes').value, website: $('#website').value,
        lines: ls.map(l => ({ id: l.id, option: l.option, qty: l.qty, addons: l.adds })) }) });
    const r = await res.json();
    if (!r.ok) {
      err.textContent = r.error || 'Something went wrong. Please try again.';
      if (r.soldOut) { soldOut = new Set(r.soldOut); soldOut.forEach(k => delete cart[k]); renderMenu(); }
      if (r.paused) { open = false; banner(r.error, true); renderMenu(); }
    } else {
      const order = { code: r.order, total: r.total, pickup: r.pickup, placed: r.placed, phone: digits.slice(-4),
        summary: ls.map(l => `${l.qty}× ${l.name}${l.option ? ' (' + l.option + ')' : ''}${l.addNames.map(n => ' + ' + n).join('')}`).join('\n') };
      store.set('ph-last-order', order); cart = {}; extras = {}; store.set('ph-cart', null); store.set('ph-extras', null);
      showDone(order);
      return;
    }
  } catch (ex) {
    err.textContent = "We couldn't send your order. Check your connection and try again, or order at the counter.";
  }
  sending = false; $('#place').textContent = 'Place order'; renderCart();
});

const STATUS_TEXT = {
  New: ['Waiting for payment', "Pay at the counter (cash or GCash) and show this number. We start making your order once it's paid."],
  Preparing: ['Paid · preparing', "Thank you! We're making your order now."],
  Ready: ['Ready for pickup!', 'Come to the counter and show this number.'],
  'Picked up': ['Picked up', 'Enjoy! Thank you for ordering.'],
  Cancelled: ['Cancelled', 'This order was cancelled. Please ask at the counter.'],
};
let poll;
function showDone(o, status) {
  window.scrollTo(0, 0);
  $('#cartbar').hidden = true;
  const [label, text] = STATUS_TEXT[status || 'New'] || STATUS_TEXT.New;
  $('#app').innerHTML = `<div class="done">
    <p class="k">Your order number</p><p class="num">${esc(o.code)}</p>
    <span class="st ${esc((status || 'New').split(' ')[0])}" id="st">${esc(label)}</span>
    <p id="sttext">${esc(text)}</p>
    <p><b>Total ${peso(o.total)}</b> · pay at the counter first<br>Pickup: ${esc(o.pickup || '')}</p>
    <div class="sum">${esc(o.summary)}</div>
    <button class="again" id="again">Start a new order</button>
    <p><a class="back" href="./">← Back to the menu</a></p></div>`;
  $('#again').onclick = () => { store.set('ph-last-order', null); location.reload(); };
  clearInterval(poll);
  if (status !== 'Picked up' && status !== 'Cancelled') poll = setInterval(() => checkOrder(o), 20000);
}

async function checkOrder(o) {
  try {
    const r = await (await fetch(`${DATA.url}?order=${encodeURIComponent(o.code)}&phone=${o.phone}`, { cache: 'no-store' })).json();
    if (r.ok && r.status) {
      const [label, text] = STATUS_TEXT[r.status] || STATUS_TEXT.New;
      const st = $('#st'); if (!st) return;
      st.textContent = label; st.className = 'st ' + r.status.split(' ')[0]; $('#sttext').textContent = text;
      if (r.status === 'Picked up' || r.status === 'Cancelled') { clearInterval(poll); store.set('ph-last-order', null); }
    }
  } catch (e) {}
}

const last = store.get('ph-last-order');
if (last && DATA.url) { showDone(last); checkOrder(last); }
else { renderMenu(); renderCart(); loadStatus().then(() => { renderMenu(); renderCart(); }); }
</script>
